[project]
name = "excel-serial-date"
version = "0.1.1"
description = "Translates Excel serial date numbers to Python date objects, handling both epoch systems and the 1900 leap year bug."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
